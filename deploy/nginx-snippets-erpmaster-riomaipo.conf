# ERP Master — /riomaipo → Flask Río Maipo (:8505)
# ============================================================
# Incluir en el server HTTPS de erpmaster.cl ANTES del catch-all
# que redirige a /laconcepcion/:
#
#   include /etc/nginx/snippets/erpmaster-riomaipo.conf;
#
# En el VPS este archivo vive en:
#   /etc/nginx/snippets/erpmaster-riomaipo.conf

location = /riomaipo {
    return 301 /riomaipo/;
}

location /riomaipo/ {
    # Recorta el prefijo: Flask ve rutas en /
    proxy_pass http://127.0.0.1:8505/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /riomaipo;
    proxy_read_timeout 120;
    proxy_send_timeout 120;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
