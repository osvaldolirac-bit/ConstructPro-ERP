map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP — ACME + redirect HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name erpmaster.cl www.erpmaster.cl;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Demo, La Concepción, Río Maipo
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erpmaster.cl www.erpmaster.cl;

    ssl_certificate /etc/letsencrypt/live/erpmaster.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erpmaster.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location = /demo {
        return 301 /demo/;
    }

    location = /laconcepcion {
        return 301 /laconcepcion/;
    }

    location = /riomaipo {
        return 301 /riomaipo/;
    }

    location /demo/ {
        proxy_pass http://127.0.0.1:8504/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /demo;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /laconcepcion/ {
        proxy_pass http://127.0.0.1:8502/laconcepcion/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /laconcepcion;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Río Maipo Flask (:8505) — NO BORRAR
    location /riomaipo/ {
        proxy_pass http://127.0.0.1:8505/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /riomaipo;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /_stcore/ {
        return 404;
    }

    location = / {
        return 302 /laconcepcion/;
    }

    location / {
        return 302 /laconcepcion/;
    }
}

# IP:8503 -> /demo/
server {
    listen 8503;
    listen [::]:8503;
    server_name _;

    location = / {
        return 301 /demo/;
    }

    location /demo/ {
        proxy_pass http://127.0.0.1:8504/demo/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        return 301 /demo/;
    }
}
