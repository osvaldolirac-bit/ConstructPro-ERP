# ERP Master — /riomaipo  →  Flask Río Maipo (puerto 8505)
# ============================================================
# Reemplaza el proxy Streamlit. Debe ir ANTES del redirect a /laconcepcion/

location = /riomaipo {
    return 301 /riomaipo/;
}

location /riomaipo/ {
    # Recorta el prefijo: Flask ve rutas en /
    proxy_pass http://127.0.0.1:8505/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /riomaipo;

    proxy_read_timeout 120;
}
