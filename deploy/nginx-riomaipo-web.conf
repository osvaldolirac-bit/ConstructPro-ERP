# ERP Master — /riomaipo  →  Flask Río Maipo (puerto 8505)
# ============================================================
# Preferido en el VPS: snippet durable
#   /etc/nginx/snippets/erpmaster-riomaipo.conf
# e incluirlo en erpmaster.cl ANTES del catch-all a /laconcepcion/:
#   include /etc/nginx/snippets/erpmaster-riomaipo.conf;
#
# Cuidado: scripts como /root/fix_demo_nginx.sh o
# /root/erpmaster.cl.nginx.conf pueden sobrescribir el vhost y
# borrar el bloque inline. El include del snippet evita perder la ruta.

location = /riomaipo {
    return 301 /riomaipo/;
}

location /riomaipo/ {
    # Recorta el prefijo: Flask ve rutas en /
    proxy_pass http://127.0.0.1:8505/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /riomaipo;

    proxy_read_timeout 120;
}
