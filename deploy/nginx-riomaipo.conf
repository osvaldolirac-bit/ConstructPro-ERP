# ERP Master — carril Río Maipo
# ================================
# IMPORTANTE: hoy nginx redirige /riomaipo → /laconcepcion/
# Este bloque DEBE ir ANTES del catch-all / redirect a La Concepción.
#
# Puertos del VPS (no mezclar):
#   La Concepción (Streamlit)  → suele ser 8501 (u otro 85xx)
#   Demo (Streamlit)           → otro 85xx
#   Río Maipo (FastAPI/uvicorn)→ 8010  << exclusivo
#
# Incluir desde el server { } de erpmaster.cl, por ejemplo:
#   include /var/www/erpmaster/constructpro-erp/deploy/nginx-riomaipo.conf;

# Sin barra final → con barra
location = /riomaipo {
    return 301 /riomaipo/;
}

# Proxy al proceso propio de Río Maipo (puerto 8010)
location /riomaipo/ {
    proxy_pass http://127.0.0.1:8010/riomaipo/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /riomaipo;

    proxy_read_timeout 120s;
    proxy_redirect off;
}

# Health check sin caer en La Concepción
location = /riomaipo/health {
    proxy_pass http://127.0.0.1:8010/riomaipo/health;
    proxy_set_header Host $host;
}
