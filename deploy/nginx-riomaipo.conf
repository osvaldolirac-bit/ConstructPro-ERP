# ERP Master — /riomaipo  →  Streamlit Río Maipo (puerto 8505)
# ============================================================
# CRÍTICO: este bloque debe ir ANTES del redirect catch-all a /laconcepcion/
#
# Puertos del VPS (NO mezclar):
#   /laconcepcion  → Streamlit La Concepción  (ej. 8501)
#   /demo          → Streamlit Demo           (ej. 8502)
#   /riomaipo      → Streamlit Río Maipo      (8505)  << este
#
# Incluir dentro del server { } de erpmaster.cl

location = /riomaipo {
    return 301 /riomaipo/;
}

location /riomaipo/ {
    proxy_pass http://127.0.0.1:8505/riomaipo/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_read_timeout 86400;
    proxy_buffering off;
}

# WebSocket Streamlit
location /riomaipo/_stcore/ {
    proxy_pass http://127.0.0.1:8505/riomaipo/_stcore/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}
