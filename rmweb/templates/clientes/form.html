{% extends "base.html" %}
{% block title %}{{ 'Editar' if row else 'Nuevo' }} cliente{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>{% if row %}Editar cliente{% else %}Nuevo cliente{% endif %}</h1></div>
  <a class="btn btn-outline-secondary" href="{{ url_for('clientes_list') }}">Volver</a>
</div>
<div class="panel">
  <form method="post" class="row g-3">
    <div class="col-md-4"><label class="form-label fw-bold">RUT</label><input class="form-control" name="rut" value="{{ row.rut if row and row.rut else '' }}"></div>
    <div class="col-md-8"><label class="form-label fw-bold">Razón social</label><input class="form-control" name="razon_social" value="{{ row.razon_social if row else '' }}" required></div>
    <div class="col-md-4"><label class="form-label fw-bold">Contacto</label><input class="form-control" name="contacto" value="{{ row.contacto if row and row.contacto else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Teléfono</label><input class="form-control" name="telefono" value="{{ row.telefono if row and row.telefono else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Email</label><input class="form-control" name="email" value="{{ row.email if row and row.email else '' }}"></div>
    <div class="col-md-8"><label class="form-label fw-bold">Dirección</label><input class="form-control" name="direccion" value="{{ row.direccion if row and row.direccion else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Comuna</label><input class="form-control" name="comuna" value="{{ row.comuna if row and row.comuna else '' }}"></div>
    <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="activo" value="1" id="act" {% if not row or row.activo %}checked{% endif %}><label class="form-check-label" for="act">Activo</label></div></div>
    <div class="col-12"><button class="btn btn-primary fw-bold" type="submit">Guardar</button></div>
  </form>
</div>
{% endblock %}
