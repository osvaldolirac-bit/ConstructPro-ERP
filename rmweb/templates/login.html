<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Río Maipo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="text-uppercase small fw-bold text-secondary mb-1">ERP Master</div>
      <h1>Río Maipo</h1>
      <p>Ingresa con tu usuario para continuar.</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-bold">Usuario</label>
          <input class="form-control" name="usuario" value="{{ default_user }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Clave</label>
          <input class="form-control" type="password" name="clave" required>
        </div>
        <button class="btn btn-primary w-100 fw-bold" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
