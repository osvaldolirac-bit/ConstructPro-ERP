{% extends "base.html" %}
{% block title %}Administración{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Administración</h1><p>Empresa y parámetros.</p></div></div>
<div class="panel">
  <h5 class="fw-bold mb-3">Mi empresa</h5>
  <form method="post" action="{{ url_for('admin_empresa') }}" class="row g-3">
    <div class="col-md-4"><label class="form-label fw-bold">RUT</label><input class="form-control" name="rut" value="{{ empresa.rut if empresa else '' }}"></div>
    <div class="col-md-8"><label class="form-label fw-bold">Razón social</label><input class="form-control" name="razon_social" value="{{ empresa.razon_social if empresa else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Teléfono</label><input class="form-control" name="telefono" value="{{ empresa.telefono if empresa else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Email</label><input class="form-control" name="email" value="{{ empresa.email if empresa else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">País</label><input class="form-control" name="pais" value="{{ empresa.pais if empresa else 'Chile' }}"></div>
    <div class="col-md-8"><label class="form-label fw-bold">Dirección</label><input class="form-control" name="direccion" value="{{ empresa.direccion if empresa else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Región</label><input class="form-control" name="region" value="{{ empresa.region if empresa else '' }}"></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Guardar empresa</button></div>
  </form>
</div>
<div class="panel">
  <h5 class="fw-bold mb-3">Parámetros</h5>
  <table class="table table-sm">
    <thead><tr><th>Clave</th><th>Nombre</th><th>Valor</th><th>Unidad</th></tr></thead>
    <tbody>
      {% for p in params %}
      <tr><td>{{ p.clave }}</td><td>{{ p.nombre }}</td><td>{{ p.valor }}</td><td>{{ p.unidad }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
