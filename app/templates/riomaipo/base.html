<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ track_name }}{% endblock %} · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ prefix }}/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-kicker">{{ app_name }}</span>
        <h2 class="brand-title">{{ track_name }}</h2>
        <p class="brand-sub">Carril independiente · erpmaster.cl{{ prefix }}</p>
      </div>
      <nav class="nav">
        <a href="{{ prefix }}/" class="{% if active == 'dashboard' %}active{% endif %}">
          <span class="nav-ico">▣</span> Dashboard
        </a>
        <a href="{{ prefix }}/cotizaciones/" class="{% if active == 'cotizaciones' %}active{% endif %}">
          <span class="nav-ico">✎</span> Cotizaciones
        </a>
        <a href="{{ prefix }}/cuentas-por-cobrar/" class="{% if active == 'cuentas' %}active{% endif %}">
          <span class="nav-ico">$</span> Cuentas por cobrar
        </a>
        <a href="{{ prefix }}/administracion/" class="{% if active == 'administracion' %}active{% endif %}">
          <span class="nav-ico">⚙</span> Administración
        </a>
      </nav>
    </aside>

    <main class="main">
      {% if flash %}
      <div class="flash {{ flash.level }}">{{ flash.message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
